<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Fadheel Ahmad Alfaiz — tautan aplikasi &amp; proyek." />
  <meta name="theme-color" content="#0b1220" />
  <meta property="og:title" content="Fadheel Ahmad Alfaiz" />
  <meta property="og:description" content="Link hub &amp; unduhan aplikasi." />
  <meta property="og:type" content="website" />
  <title>Fadheel Ahmad Alfaiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hover: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4f7fb;
      --muted: #9aa8bc;
      --accent: #5b9dff;
      --accent-soft: rgba(91, 157, 255, 0.16);
      --green: #3dcc7a;
      --green-soft: rgba(61, 204, 122, 0.14);
      --radius: 16px;
      --font: "DM Sans", system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }

    body {
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(91, 157, 255, 0.18), transparent 55%),
        radial-gradient(700px 400px at 100% 30%, rgba(61, 204, 122, 0.08), transparent 50%),
        radial-gradient(600px 360px at 0% 80%, rgba(120, 90, 255, 0.08), transparent 45%),
        var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding:
        max(2rem, env(safe-area-inset-top))
        1.25rem
        max(2rem, env(safe-area-inset-bottom));
    }

    .wrap {
      width: min(100%, 440px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .profile { text-align: center; padding-top: 0.5rem; }

    .avatar-wrap {
      position: relative;
      width: 104px;
      height: 104px;
      margin: 0 auto 1rem;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow), 0 0 0 6px rgba(91, 157, 255, 0.08);
      background: #1a2438;
    }

    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid rgba(91, 157, 255, 0.35);
      pointer-events: none;
    }

    .name {
      font-family: var(--display);
      font-size: clamp(1.55rem, 5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .tagline {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .social {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 36px;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      touch-action: manipulation;
    }

    .social:hover {
      color: var(--text);
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .social:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .social svg { width: 14px; height: 14px; flex-shrink: 0; }

    .section { width: 100%; }

    .section-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
      padding-left: 0.15rem;
    }

    .section-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .links { display: grid; gap: 0.7rem; }

    .link-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 0.9rem;
      width: 100%;
      min-height: 72px;
      padding: 0.9rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.04), transparent 40%),
        var(--bg-card);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .link-card:hover {
      transform: translateY(-2px);
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
    }

    .link-card:active { transform: translateY(0); }

    .link-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .icon svg { width: 22px; height: 22px; }

    .icon-green {
      background: var(--green-soft);
      color: var(--green);
      border-color: rgba(61, 204, 122, 0.25);
    }

    .link-text { min-width: 0; }

    .link-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .link-desc {
      margin-top: 0.15rem;
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chev {
      width: 18px;
      height: 18px;
      color: var(--muted);
      opacity: 0.7;
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.35rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--green);
      background: var(--green-soft);
      border: 1px solid rgba(61, 204, 122, 0.22);
      border-radius: 999px;
      padding: 0.15rem 0.5rem;
    }

    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    footer {
      margin-top: 0.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
    }

    footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="profile">
      <div class="avatar-wrap">
        <img
          class="avatar"
          src="https://avatars.githubusercontent.com/u/147017460?v=4"
          width="104"
          height="104"
          alt="Foto profil Fadheel Ahmad Alfaiz"
        />
        <span class="avatar-ring" aria-hidden="true"></span>
      </div>
      <h1 class="name">Fadheel Ahmad Alfaiz</h1>
      <p class="tagline">Builder · apps, tools &amp; side projects</p>
      <div class="socials">
        <a class="social" href="https://github.com/fadheelahmadalfaiz" target="_blank" rel="noopener noreferrer">

          GitHub
        </a>
        <a class="social" href="https://izz.my.id" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>

        </a>
      </div>
    </header>

    <section class="section" aria-labelledby="apps-label">
      <h2 id="apps-label" class="section-label">Apps</h2>
      <div class="links">
        <a class="link-card" href="/apps/faizherbals/">
          <div class="icon icon-green" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22c-4-3.5-7-6.8-7-11a7 7 0 0 1 14 0c0 4.2-3 7.5-7 11z" />
              <path d="M12 11v6" />
              <path d="M9.5 14.5c1.2-1.8 2.5-2.5 2.5-2.5s1.3.7 2.5 2.5" />

          </div>
          <div class="link-text">
            <div class="link-title">Faiz Herbals</div>
            <div class="link-desc">Download APK terbaru (Android)</div>
            <span class="badge"><span class="dot" aria-hidden="true"></span> Latest build</span>
          </div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </a>
      </div>
    </section>

    <footer>
      Hosted on
      <a href="https://github.com/fadheelahmadalfaiz/fadheelahmadalfaiz.github.io" target="_blank" rel="noopener noreferrer">GitHub Pages</a>
    </footer>
  </main>
</body>
</html>
