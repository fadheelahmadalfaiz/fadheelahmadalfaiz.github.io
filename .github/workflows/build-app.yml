name: Build and release app

on:
  workflow_call:
    inputs:
      project_path:
        description: "Path to the app project, relative to the repo root"
        required: false
        type: string
        default: "."
      platform:
        description: "auto, flutter, android, react-native, or expo"
        required: false
        type: string
        default: "auto"
      build_type:
        description: "release or debug"
        required: false
        type: string
        default: "release"
      tag_prefix:
        description: "Prefix for the GitHub release tag"
        required: false
        type: string
        default: "build"
      flutter_version:
        description: "Flutter SDK version"
        required: false
        type: string
        default: "3.38.9"
      java_version:
        description: "Java version"
        required: false
        type: string
        default: "17"
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      publish_release:
        description: "Create a GitHub release with the built APK"
        required: false
        type: boolean
        default: true
      build_aab:
        description: "Also build an AAB for Flutter"
        required: false
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      HUB_DISPATCH_TOKEN:
        required: false
    outputs:
      release_tag:
        description: "Tag of the created release"
        value: ${{ jobs.release.outputs.tag }}
      apk_name:
        description: "Name of the APK asset"
        value: ${{ jobs.build.outputs.apk_name }}
      platform:
        description: "Detected platform"
        value: ${{ jobs.build.outputs.platform }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      apk_name: ${{ steps.collect.outputs.apk_name }}
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
      platform: ${{ steps.detect.outputs.platform }}
      effective_build_type: ${{ steps.detect.outputs.effective_build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Detect project
        id: detect
        shell: bash
        working-directory: ${{ inputs.project_path }}
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          REQUESTED_BUILD_TYPE: ${{ inputs.build_type }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          platform="${REQUESTED_PLATFORM:-auto}"
          build_type="${REQUESTED_BUILD_TYPE:-release}"

          if [ "$platform" = "auto" ]; then
            if [ -f pubspec.yaml ]; then
              platform=flutter
            elif [ -f package.json ] && grep -Eq '"expo"' package.json; then
              platform=expo
            elif [ -f package.json ] && grep -Eq '"react-native"' package.json; then
              platform=react-native
            elif [ -f gradlew ] && { [ -f settings.gradle ] || [ -f settings.gradle.kts ]; }; then
              platform=android
            elif [ -f android/gradlew ]; then
              platform=android
            else
              echo "::error::Tidak bisa mendeteksi platform. Set input platform secara eksplisit."
              exit 1
            fi
          fi

          case "$platform" in
            flutter|android|react-native|expo) ;;
            *)
              echo "::error::Platform tidak dikenal: $platform"
              exit 1
              ;;
          esac

          case "$build_type" in
            release|debug) ;;
            *)
              echo "::error::build_type harus release atau debug."
              exit 1
              ;;
          esac

          effective="$build_type"
          if [ "$build_type" = "release" ] && [ "$platform" != "flutter" ] && [ -z "${KEYSTORE_BASE64:-}" ]; then
            effective=debug
            echo "::notice::Keystore tidak diset; build debug dipakai agar APK tetap bisa di-install."
          fi

          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          echo "effective_build_type=$effective" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Set up Flutter
        if: steps.detect.outputs.platform == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Set up Node
        if: steps.detect.outputs.platform == 'react-native' || steps.detect.outputs.platform == 'expo'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Restore Android signing key
        if: steps.detect.outputs.platform != 'flutter'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Tidak ada secret keystore; signing dilewati."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          ls -lh "$RUNNER_TEMP/upload-keystore.jks"

      - name: Configure Flutter signing
        if: steps.detect.outputs.platform == 'flutter'
        shell: bash
        working-directory: ${{ inputs.project_path }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Tidak ada secret keystore; Flutter memakai signing default."
            exit 0
          fi
          mkdir -p android
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=../upload-keystore.jks
          EOF

      - name: Flutter dependencies
        if: steps.detect.outputs.platform == 'flutter'
        working-directory: ${{ inputs.project_path }}
        run: flutter pub get

      - name: Install Node dependencies
        if: steps.detect.outputs.platform == 'react-native' || steps.detect.outputs.platform == 'expo'
        shell: bash
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Flutter APK
        if: steps.detect.outputs.platform == 'flutter'
        shell: bash
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          if [ "${{ steps.detect.outputs.effective_build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Build Flutter AAB
        if: steps.detect.outputs.platform == 'flutter' && steps.detect.outputs.effective_build_type == 'release' && inputs.build_aab
        shell: bash
        working-directory: ${{ inputs.project_path }}
        run: flutter build appbundle --release

      - name: Prebuild Expo Android project
        if: steps.detect.outputs.platform == 'expo'
        shell: bash
        working-directory: ${{ inputs.project_path }}
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android APK
        if: steps.detect.outputs.platform == 'android' || steps.detect.outputs.platform == 'react-native' || steps.detect.outputs.platform == 'expo'
        shell: bash
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          android_dir="android"
          if [ "${{ steps.detect.outputs.platform }}" = "android" ] && [ -f gradlew ]; then
            android_dir="."
          fi
          cd "$android_dir"
          chmod +x gradlew
          if [ "${{ steps.detect.outputs.effective_build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Sign release APK
        if: steps.detect.outputs.effective_build_type == 'release' && (steps.detect.outputs.platform == 'android' || steps.detect.outputs.platform == 'react-native' || steps.detect.outputs.platform == 'expo')
        shell: bash
        working-directory: ${{ inputs.project_path }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Release build tanpa keystore. Set signing secrets atau build_type=debug."
            exit 1
          fi
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"

          unsigned="$(find . -type f -path '*/build/outputs/apk/release/*unsigned*.apk' | head -n1 || true)"
          if [ -z "$unsigned" ]; then
            echo "Tidak ada APK unsigned; Gradle sudah menandatangani APK."
            exit 0
          fi

          build_tools="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          aligned="$RUNNER_TEMP/aligned.apk"
          signed="$RUNNER_TEMP/signed.apk"
          "$ANDROID_HOME/build-tools/$build_tools/zipalign" -f 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --out "$signed" "$aligned"
          signed_target="$(dirname "$unsigned")/$(basename "$unsigned" | sed 's/unsigned/signed/')"
          cp "$signed" "$signed_target"
          rm -f "$unsigned"

      - name: Collect artifacts
        id: collect
        shell: bash
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          apk="$(find . -type f -name '*universal*release*.apk' ! -path '*/intermediates/*' | head -n1 || true)"
          if [ -z "$apk" ]; then
            apk="$(find . -type f -name '*release*.apk' ! -name '*unsigned*' ! -path '*/intermediates/*' ! -path '*/androidTest/*' | head -n1 || true)"
          fi
          if [ -z "$apk" ]; then
            apk="$(find . -type f -name '*.apk' ! -name '*unaligned*' ! -path '*/intermediates/*' ! -path '*/androidTest/*' | head -n1 || true)"
          fi
          if [ -z "$apk" ]; then
            echo "::error::Tidak ada APK yang dihasilkan."
            find . -maxdepth 6 -type f -name '*.apk' || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/app-artifacts"
          prefix="$(basename "${{ github.repository }}")-$(git rev-parse --short HEAD)"
          apk_name="$prefix-$(basename "$apk")"
          cp "$apk" "$RUNNER_TEMP/app-artifacts/$apk_name"

          aab="$(find . -type f -name '*.aab' -path '*/outputs/bundle/*' | head -n1 || true)"
          if [ -n "$aab" ]; then
            cp "$aab" "$RUNNER_TEMP/app-artifacts/$prefix-$(basename "$aab")"
          fi

          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=app-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/app-artifacts"

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: ${{ runner.temp }}/app-artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifact

      - name: Compute tag
        id: tag
        shell: bash
        run: echo "tag=${{ inputs.tag_prefix }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ github.repository }} build #${{ github.run_number }}"
          body: |
            Auto-built from `${{ github.repository }}` at `${{ github.sha }}`.
            Platform: `${{ needs.build.outputs.platform }}`
            Build type: `${{ needs.build.outputs.effective_build_type }}`
          files: release-artifact/*
          make_latest: true

      - name: Notify hub
        env:
          HUB_DISPATCH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HUB_DISPATCH_TOKEN:-}" ]; then
            echo "HUB_DISPATCH_TOKEN tidak diset; hub akan sinkron lewat jadwal."
            exit 0
          fi
          if ! curl -fsS -X POST \
            -H "Authorization: Bearer ${HUB_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/fadheelahmadalfaiz/fadheelahmadalfaiz.github.io/dispatches \
            -d '{"event_type":"app-release"}'; then
            echo "::warning::Gagal mengirim dispatch ke hub; jadwal hub akan menyusul."
          fi
